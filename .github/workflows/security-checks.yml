name: Security Checks

# Runs on every push and every pull request.
#
# The workflow deliberately does NOT build the application: `next build` plus
# `opennextjs-cloudflare build` takes minutes and is only needed for the
# deployment, which happens in its own pipeline. What is checked here is
# cheap and catches the regressions that matter before they reach a deploy:
#
#   lint:sql    no string interpolation in SQL statements
#   typecheck   the whole project (including scripts/) compiles
#   test:unit   the unit test suite
#
# The live security verification (scripts/verify-security.ts) is not part of
# this workflow on purpose: it needs a running instance and therefore
# belongs to a job that can start one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node, because setup-node's
      # dependency cache needs the pnpm store path to exist.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The committed lockfile is lockfileVersion 9.0, which pnpm 10
          # reads and writes without a migration.
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure next-env.d.ts exists
        # next-env.d.ts is generated by Next.js and is git-ignored, so a fresh
        # checkout does not have it. `tsc --noEmit` needs its type references,
        # and recreating the file is far cheaper than a full `next build`.
        run: |
          if [ ! -f next-env.d.ts ]; then
            printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
          fi

      - name: Lint SQL
        run: pnpm run lint:sql

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit
